<main>
  <p class="k" id="tier">A Players Dubai</p>
  <h1>You’re in.</h1>
  <p class="when"><b>Dubai · 27–29 November 2026</b></p>
  <p class="note">Your receipt is on its way from Whop. We’ll be in touch with the schedule, venue details and everything you need before you fly.</p>
  <a class="back" href="../">Back to the event</a>
</main>
<script>
  /* Pushes event_purchase once per order. Tier, value and currency are the ones n8n read from
     Whop when it made this checkout, saved on this device under the checkout's event_uid; the
     order id comes from Whop's redirect. The paid sale itself is recorded server side by n8n. */
  (function () {
    var q = new URLSearchParams(location.search);
    var uid = q.get("event_uid") || "", tierParam = (q.get("tier") || "").toUpperCase();
    var NAMES = { GA: "General Admission", VIP: "VIP Experience" };
    if (NAMES[tierParam]) document.getElementById("tier").textContent = NAMES[tierParam] + " · A Players Dubai";

    function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    if (!/^[0-9a-f-]{36}$/i.test(uid)) return;
    var saved = null; try { saved = JSON.parse(load("apd_checkout_" + uid) || "null"); } catch (e) {}
    if (!saved || !saved.value || !saved.currency) return;  // not a checkout started on this device

    var order = ["payment_id", "receipt_id", "id"].map(function (k) { return q.get(k); })
      .filter(function (v) { return /^pay_/.test(v || ""); })[0] || "";
    var flag = "apd_purchase_" + (order || uid);
    if (load(flag)) return;  // a refresh or a second visit never counts the order twice
    var site = window.APD_SITE || {};
    var e = { event: "event_purchase", event_city: site.event_city, event_id: site.event_id,
      tier: saved.tier || tierParam, value: saved.value, currency: saved.currency, event_uid: uid };
    if (order) e.order_id = order;
    ["email", "phone", "first_name", "last_name"].forEach(function (k) { if (saved[k]) e[k] = saved[k]; });
    window.dataLayer.push(e);
    save(flag, "1");
  })();
</script>
